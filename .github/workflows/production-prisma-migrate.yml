name: One-time production Prisma migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-prisma-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed production migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out reviewed application commit
        uses: actions/checkout@v4
        with:
          ref: 7496f570a559b7da9ed1af92eb5160f8150a65a2
          persist-credentials: false

      - name: Verify reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="7496f570a559b7da9ed1af92eb5160f8150a65a2"
          actual_sha="$(git rev-parse HEAD)"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Checked-out commit does not match the reviewed production commit."
            exit 1
          fi

          echo "Reviewed commit verified: $actual_sha"

      - name: Verify reviewed migration checksum
        shell: bash
        run: |
          set -euo pipefail
          migration_file="backend/prisma/migrations/20260926000000_add_wanamaste_delivery_claim/migration.sql"
          expected_checksum="226726A9BBC543518129AA5686E868F81024E0C0E642D54F2820755CB0F79A3D"

          if [[ ! -f "$migration_file" ]]; then
            echo "::error::Reviewed migration file is missing."
            exit 1
          fi

          actual_checksum="$(sha256sum "$migration_file" | awk '{print toupper($1)}')"
          if [[ "$actual_checksum" != "$expected_checksum" ]]; then
            echo "::error::Reviewed migration checksum does not match."
            exit 1
          fi

          echo "Reviewed migration checksum verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify intended migration is the only pending migration
        id: preflight
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          expected_migration="20260926000000_add_wanamaste_delivery_claim"
          status_file="$RUNNER_TEMP/prisma-status-before.txt"
          trap 'rm -f "$status_file"' EXIT

          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::The production DATABASE_URL secret is not configured."
            exit 1
          fi

          set +e
          npx prisma migrate status --schema=backend/prisma/schema.prisma >"$status_file" 2>&1
          status_code=$?
          set -e

          if [[ $status_code -eq 0 ]]; then
            echo "should_migrate=false" >> "$GITHUB_OUTPUT"
            echo "migration_status=already-applied" >> "$GITHUB_OUTPUT"
            echo "All repository migrations are already applied; no migration command will run."
            exit 0
          fi

          if ! grep -q "have not yet been applied" "$status_file"; then
            echo "::error::Prisma migration status could not establish a safe pending-migration state."
            exit 1
          fi

          mapfile -t pending_migrations < <(
            grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+' "$status_file" | sort -u
          )

          if [[ ${#pending_migrations[@]} -ne 1 ]] || [[ "${pending_migrations[0]:-}" != "$expected_migration" ]]; then
            echo "::error::The reviewed migration is not the sole pending migration."
            if [[ ${#pending_migrations[@]} -gt 0 ]]; then
              printf 'Pending migration names: %s\n' "${pending_migrations[*]}"
            fi
            exit 1
          fi

          echo "should_migrate=true" >> "$GITHUB_OUTPUT"
          echo "migration_status=pending" >> "$GITHUB_OUTPUT"
          echo "The reviewed migration is the only pending migration."

      - name: Apply reviewed Prisma migration
        if: steps.preflight.outputs.should_migrate == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/prisma-deploy.txt"
          trap 'rm -f "$deploy_log"' EXIT

          if ! npm run prisma:deploy >"$deploy_log" 2>&1; then
            echo "::error::Prisma migration deployment failed. Review database-side logs without exposing credentials."
            exit 1
          fi

          echo "Reviewed migration command completed successfully."

      - name: Verify production migration status
        if: steps.preflight.outputs.should_migrate == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/prisma-status-after.txt"
          trap 'rm -f "$status_file"' EXIT

          if ! npx prisma migrate status --schema=backend/prisma/schema.prisma >"$status_file" 2>&1; then
            echo "::error::Post-migration Prisma status verification failed."
            exit 1
          fi

          echo "Prisma confirms that all repository migrations are applied."

      - name: Write safe migration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Prisma migration"
            echo "- Reviewed commit: \`7496f570a559b7da9ed1af92eb5160f8150a65a2\`"
            echo "- Migration: \`20260926000000_add_wanamaste_delivery_claim\`"
            echo "- Preflight status: \`${{ steps.preflight.outputs.migration_status || 'not-established' }}\`"
            if [[ "${{ steps.preflight.outputs.should_migrate }}" == "true" ]]; then
              echo "- Result: migration command executed; post-migration status step determines final success"
            elif [[ "${{ steps.preflight.outputs.migration_status }}" == "already-applied" ]]; then
              echo "- Result: already applied; migration command was not executed"
            else
              echo "- Result: stopped before migration"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
